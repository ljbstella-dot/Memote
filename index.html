<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#3d5a3e">
<meta name="description" content="나만의 메모 앱 Memote">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Memote">
<title>Memote</title>
<link rel="manifest" id="pwa-manifest">
<script>
(function() {
  const manifest = {
    name: "Memote", short_name: "Memote", description: "나만의 메모 앱",
    start_url: ".", display: "standalone",
    background_color: "#f5f0e8", theme_color: "#3d5a3e",
    icons: [
      { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%233d5a3e'/%3E%3Ctext x='96' y='130' font-size='110' text-anchor='middle' fill='%23fffef5'%3E📝%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
})();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(reg => {
      const url = ((reg.active||reg.installing||reg.waiting)||{}).scriptURL||'';
      if (url.startsWith('blob:')) reg.unregister();
    });
  });
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
  if (location.protocol==='https:'||location.hostname==='localhost') {
    navigator.serviceWorker.register('./sw.js').then(r=>{r.update();}).catch(()=>{});
  }
}
</script>
<style>
:root{
  --bg:#f5f0e8;--surface:#fffef9;--surface2:#f0ebe0;
  --border:#d4c9b0;--text:#2c2416;--text2:#7a6a50;
  --accent:#3d5a3e;--accent2:#c4743a;
  --shadow:rgba(60,40,10,0.13);--note-bg:#fffef5;
  --line-color:#c8dfe8;--ruled-h:32px;
  --sidebar-w:260px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Georgia','Nanum Myeongjo',serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;}
#app{display:flex;height:100vh;height:100dvh;overflow:hidden;}

/* ── SIDEBAR ── */
#sidebar{width:var(--sidebar-w);min-width:0;background:var(--surface2);border-right:1.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .25s cubic-bezier(.4,0,.2,1);flex-shrink:0;}
#sidebar.collapsed{width:0;border-right:none;}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0;}
#sidebar-toggle{position:fixed;top:12px;left:12px;z-index:200;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;cursor:pointer;font-size:16px;line-height:1;color:var(--text);transition:left .25s cubic-bezier(.4,0,.2,1);}
#sidebar-toggle.open{left:calc(var(--sidebar-w) + 8px);}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:150;}
.sidebar-header{padding:20px 16px 12px;border-bottom:1px solid var(--border);}
.app-title{font-size:22px;font-weight:bold;letter-spacing:2px;color:var(--accent);font-family:'Palatino Linotype',serif;}
.app-subtitle{font-size:10px;color:var(--text2);letter-spacing:3px;margin-top:2px;}
.sidebar-search{margin:10px 12px 0;position:relative;}
.sidebar-search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;color:var(--text);outline:none;}
.sidebar-search::before{content:"🔍";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;}
.nav-label{font-size:10px;letter-spacing:2px;color:var(--text2);padding:6px 16px 2px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;font-size:13px;color:var(--text);transition:background .15s;user-select:none;}
.nav-item:hover{background:rgba(61,90,62,.08);}
.nav-item.active{background:rgba(61,90,62,.15);font-weight:bold;color:var(--accent);}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--text2);background:var(--border);border-radius:10px;padding:1px 7px;}
.folder-item{display:flex;align-items:center;gap:6px;padding:7px 16px 7px 28px;cursor:pointer;font-size:13px;color:var(--text);transition:background .15s;}
.folder-item:hover{background:rgba(61,90,62,.08);}
.folder-item.active{background:rgba(61,90,62,.15);font-weight:bold;color:var(--accent);}
.folder-item .count{margin-left:auto;font-size:11px;color:var(--text2);}
.folder-delete{margin-left:4px;cursor:pointer;opacity:0;color:#c0392b;font-size:12px;}
.folder-item:hover .folder-delete{opacity:1;}
.add-folder-btn{display:flex;align-items:center;gap:6px;padding:7px 16px 7px 28px;cursor:pointer;font-size:12px;color:var(--accent2);}
.add-folder-btn:hover{opacity:.75;}
.sort-bar{padding:6px 12px;border-top:1px solid var(--border);display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
.sort-label{font-size:10px;color:var(--text2);margin-right:4px;}
.sort-btn{font-size:10px;padding:3px 7px;border:1px solid var(--border);border-radius:4px;background:var(--surface);cursor:pointer;color:var(--text2);transition:all .15s;}
.sort-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── USER BAR ── */
#user-bar{display:none;padding:6px 16px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);align-items:center;gap:8px;flex-shrink:0;}
.user-name{font-weight:bold;color:var(--text);}
.user-mode-badge{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--accent);color:#fff;}
.signout-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:3px 9px;font-size:11px;cursor:pointer;color:var(--text2);}
.signout-btn:hover{background:var(--surface2);}
#lock-banner{display:none;background:#fff8e8;border-bottom:1px solid #f0d080;padding:6px 16px;font-size:12px;color:#7a5a00;align-items:center;gap:8px;flex-shrink:0;}
.lock-banner-btn{background:#f5a623;color:#fff;border:none;border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;}
.firebase-warning{background:#fff3cd;border-bottom:1px solid #ffe083;padding:6px 16px;font-size:11px;color:#856404;}

/* ── HOME ── */
#home-view{flex:1;overflow-y:auto;padding:20px 16px 20px 56px;}
.home-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.home-title{font-size:20px;font-weight:bold;}
.new-note-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.new-note-btn:hover{opacity:.85;}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px;}

/* ── NOTE CARDS ── */
.note-card{background:var(--note-bg);border:1px solid var(--border);border-radius:4px;box-shadow:2px 3px 12px var(--shadow);cursor:pointer;transition:box-shadow .2s,transform .15s;position:relative;overflow:hidden;aspect-ratio:3/4;display:flex;flex-direction:column;}
.note-card:hover{box-shadow:4px 6px 20px var(--shadow);transform:translateY(-2px);}
.note-card.is-locked .note-card-inner{filter:blur(6px);pointer-events:none;user-select:none;}
.note-card.is-locked .note-card-cover{filter:brightness(.4) saturate(.2);}
.note-card.is-locked .note-card-cover-overlay{background:rgba(0,0,0,.6);}
.lock-badge{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;}
.lock-badge .lock-icon{font-size:28px;}
.lock-badge .lock-label{font-size:11px;color:rgba(255,255,255,.9);background:rgba(0,0,0,.45);padding:2px 8px;border-radius:4px;}
.note-card-cover{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;z-index:0;}
.note-card-cover-overlay{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(to bottom,transparent 45%,rgba(0,0,0,.62) 100%);}
.note-card-cover-title{color:#fff;font-size:13px;font-weight:bold;padding:0 12px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.7);}
.note-card-cover-footer{padding:5px 12px 9px;display:flex;align-items:center;justify-content:space-between;}
.note-card-cover-date{font-size:10px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6);}
.note-card-cover-star{font-size:16px;cursor:pointer;transition:transform .1s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));z-index:4;position:relative;}
.note-card-inner{flex:1;padding:14px 12px 10px;display:flex;flex-direction:column;overflow:hidden;}
.note-card-title{font-size:14px;font-weight:bold;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.note-card-preview{font-size:11px;color:var(--text2);flex:1;overflow:hidden;line-height:1.5;}
.note-card-footer{padding:6px 12px 8px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);}
.note-card-date{font-size:10px;color:var(--text2);}
.note-card-star{font-size:16px;cursor:pointer;transition:transform .1s;z-index:4;position:relative;}
.empty-state{text-align:center;color:var(--text2);padding:60px 20px;font-size:15px;}

/* ── EDITOR ── */
#editor-view{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* 툴바 */
.editor-toolbar{background:var(--surface2);border-bottom:1.5px solid var(--border);padding:6px 10px 6px 56px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.tb-btn{background:#fff;border:1px solid #e0e0e0;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:13px;color:#333;min-width:28px;text-align:center;transition:background .1s;line-height:1;white-space:nowrap;}
.tb-btn:hover{background:#f5f5f0;}
.tb-btn.active{background:#3d5a3e;border-color:#3d5a3e;color:#fff;}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 2px;flex-shrink:0;}
/* 참조 파일 방식: input[type=color] 그대로 사용 */
input[type=color]{width:28px;height:28px;border:1px solid #ddd;border-radius:6px;cursor:pointer;padding:1px;vertical-align:middle;}
.font-size-input{width:46px;border:1px solid var(--border);border-radius:4px;padding:4px 5px;font-size:13px;color:var(--text);background:var(--surface);}
.editor-meta{padding:8px 16px 6px 56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.editor-title-input{flex:1;font-size:19px;font-weight:bold;border:none;background:transparent;color:var(--text);font-family:'Palatino Linotype',serif;outline:none;min-width:0;}
.editor-title-input::placeholder{color:var(--text2);}
.editor-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.save-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
.back-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--text2);}
.char-count{font-size:11px;color:var(--text2);white-space:nowrap;}
.editor-info{padding:3px 16px 4px 56px;font-size:11px;color:var(--text2);background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap;}

/* ── PAGED WRITING AREA ── */
.editor-area-wrapper{flex:1;overflow-y:auto;background:#ccc8c0;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;gap:0;}
.page-wrap{position:relative;width:100%;max-width:640px;margin-bottom:18px;flex-shrink:0;}
.page-num{position:absolute;bottom:7px;right:10px;font-size:10px;color:#aaa;pointer-events:none;user-select:none;}

/* A4 비율 페이지 */
.editor-paper{background:var(--note-bg);box-shadow:0 3px 20px rgba(0,0,0,.22);width:100%;position:relative;overflow:hidden;border:1px solid #bbb;}

/* contenteditable 에디터 — 세부 스타일은 JS buildEditorContent()에서 inline으로 지정 */
.editor-content{ outline:none; background:transparent; border:none; }
.editor-content.ruled{ /* ruled 배경은 JS에서 직접 지정 */ }
.editor-image{max-width:100%;height:auto;margin:8px 0;border-radius:4px;display:block;}

/* 원고지 */
.manuscript-wrap{padding:20px;display:flex;flex-direction:column;gap:0;}
.manuscript-row{display:flex;border-top:1px solid #c0a88a;}
.manuscript-row:last-child{border-bottom:1px solid #c0a88a;}
.manuscript-cell{width:32px;height:40px;border-left:1px solid #c0a88a;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);flex-shrink:0;font-family:'Georgia',serif;}
.manuscript-cell:last-child{border-right:1px solid #c0a88a;}

/* 페이지 추가 버튼 */
.add-page-btn{width:100%;max-width:640px;border:2px dashed #bbb;border-radius:6px;padding:14px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#888;font-size:13px;background:rgba(255,255,255,.25);transition:background .15s,border-color .15s;flex-shrink:0;}
.add-page-btn:hover{background:rgba(255,255,255,.55);border-color:#888;color:#555;}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal{background:var(--surface);border-radius:12px;padding:24px;min-width:300px;max-width:460px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto;}
.modal h2{font-size:17px;margin-bottom:14px;}
.modal input[type=text],.modal input[type=password]{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;color:var(--text);background:var(--bg);margin-bottom:10px;outline:none;font-family:inherit;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}
.modal-btn{padding:8px 16px;border-radius:6px;border:none;font-size:14px;cursor:pointer;font-family:inherit;}
.modal-btn.primary{background:var(--accent);color:#fff;}
.modal-btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.modal-btn.danger{background:#c0392b;color:#fff;}
.cover-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0;}
.cover-option{cursor:pointer;border:2px solid transparent;border-radius:6px;overflow:hidden;aspect-ratio:3/4;transition:border-color .15s;}
.cover-option img{width:100%;height:100%;object-fit:cover;}
.cover-option.selected{border-color:var(--accent);}
.cover-option.none-cover{display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text2);font-size:11px;}
.paper-opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;}
.paper-opt{cursor:pointer;border:2px solid var(--border);border-radius:6px;padding:10px;text-align:center;font-size:12px;transition:all .15s;}
.paper-opt:hover{border-color:var(--accent);}
.paper-opt.selected{border-color:var(--accent);background:rgba(61,90,62,.08);font-weight:bold;}
.error-msg{color:#c0392b;font-size:13px;margin-top:-6px;margin-bottom:8px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:2000;animation:toastIn .2s;white-space:nowrap;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* ── MOBILE ── */
@media(max-width:640px){
  :root{--sidebar-w:240px;}
  #sidebar{position:fixed;top:0;left:0;height:100dvh;z-index:160;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);width:var(--sidebar-w) !important;}
  #sidebar.mobile-open{transform:translateX(0);}
  #sidebar-overlay.visible{display:block;}
  #sidebar-toggle.open{left:10px;}
  #home-view{padding:14px 12px 14px 48px;}
  .notes-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .editor-toolbar{padding:5px 8px 5px 44px;}
  .editor-meta{padding:7px 10px 5px 44px;}
  .editor-info{padding:3px 10px 3px 44px;}
  .editor-content{padding:24px 18px;}
  .manuscript-cell{width:22px;height:28px;font-size:13px;}
}
</style>
</head>
<body>
<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<button id="sidebar-toggle" onclick="toggleSidebar()">☰</button>

<div id="app">
<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="app-title">Memote</div>
    <div class="app-subtitle">나만의 메모 공간</div>
  </div>
  <div class="sidebar-search">
    <input type="text" id="search-input" placeholder="메모 검색..." oninput="renderHome()">
  </div>
  <div class="sidebar-nav" id="sidebar-nav"></div>
  <div class="sort-bar">
    <span class="sort-label">정렬:</span>
    <button class="sort-btn active" id="sort-new" onclick="setSort('newest')">최신순</button>
    <button class="sort-btn" id="sort-old" onclick="setSort('oldest')">오래된순</button>
    <button class="sort-btn" id="sort-edit" onclick="setSort('edited')">편집순</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="user-bar">
    <span id="user-avatar-area"></span>
    <span class="user-name" id="user-name-text"></span>
    <span class="user-mode-badge" id="user-mode-badge"></span>
    <button class="signout-btn" onclick="showChangeLockPasswordModal()" id="change-pw-btn">🔑 잠금PW</button>
    <button class="signout-btn" onclick="doSignOut()">로그아웃</button>
  </div>
  <div id="lock-banner">
    🔒 잠금 비밀번호가 설정되지 않았습니다.
    <button class="lock-banner-btn" onclick="showSetLockPasswordModal()">지금 설정하기</button>
  </div>

  <!-- HOME VIEW -->
  <div id="home-view">
    <div class="home-header">
      <div class="home-title" id="home-title">전체 메모</div>
      <button class="new-note-btn" onclick="newNote()">＋ 새 메모</button>
    </div>
    <div class="notes-grid" id="notes-grid"></div>
  </div>

  <!-- EDITOR VIEW -->
  <div id="editor-view" style="display:none;">
    <div class="editor-toolbar">
      <button class="tb-btn" onclick="doUndo()" title="이전으로 (Ctrl+Z)" style="font-size:17px;">↩</button>
      <button class="tb-btn" onclick="doRedo()" title="원래대로 (Ctrl+Y)" style="font-size:17px;">↪</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="btn-bold" onclick="fmt('bold')" title="굵게"><b>B</b></button>
      <button class="tb-btn" id="btn-italic" onclick="fmt('italic')" title="기울임"><i>I</i></button>
      <div class="tb-sep"></div>
      <span style="font-size:11px;color:var(--text2);">크기</span>
      <input type="number" class="font-size-input" id="font-size-input" min="1" max="30" value="8" onchange="applyFontSize(this.value)" title="글자 크기 (1-30pt)">
      <div class="tb-sep"></div>
      <!-- 참조 파일 방식: input[type=color] 직접 사용 -->
      <span style="font-size:11px;color:var(--text2);">글자색</span>
      <input type="color" id="fontColor" value="#2c2416" onchange="applyColor()" title="글자 색상">
      <span style="font-size:11px;color:var(--text2);">형광펜</span>
      <input type="color" id="hlColor" value="#ffff00" onchange="applyHL()" title="형광펜 색상">
      <button class="tb-btn" onclick="clearHL()" title="형광펜 지우기" style="font-size:11px;">지우기</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="insertImage()" title="이미지">🖼</button>
      <button class="tb-btn" onclick="showCoverModal()" title="표지">📎 표지</button>
      <button class="tb-btn" onclick="showPaperModal()" title="형식">📄 형식</button>
      <button class="tb-btn" onclick="showLockModal()" id="lock-btn" title="잠금">🔓</button>
      <button class="tb-btn" onclick="exportNote()" title="저장">⬇️</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="showMoveModal()" title="폴더">📁</button>

// ── STATE ──
let state = {
  notes:[], folders:[], currentView:'all', sort:'newest',
  currentNoteId:null, paperType:'plain', editorFontSize:16,
  lockPasswordHash:null, sidebarOpen:true,
  localMode:false,
};
let pages = []; // [{id,content}] plain/ruled용
const undoStack=[], redoStack=[];
const UNDO_LIMIT=200;
let pageOverflowObservers = []; // ResizeObserver 목록

// ── PERSIST ──
function loadState() {
  try {
    const s=JSON.parse(localStorage.getItem('memote_state_v3')||'{}');
    state.notes=s.notes||[]; state.folders=s.folders||[];
    state.sort=s.sort||'newest'; state.lockPasswordHash=s.lockPasswordHash||null;
  } catch(e){}
}
function saveState() {
  try { localStorage.setItem('memote_state_v3',JSON.stringify({notes:state.notes,folders:state.folders,sort:state.sort,lockPasswordHash:state.lockPasswordHash})); }
  catch(e){ showToast('저장 공간 부족'); }
}

// ── FIRESTORE ──
async function loadFromFirestore() {
  if(!db||!fbUser) return;
  try {
    const {collection,getDocs,doc,getDoc} = window._fb;
    const notesSnap = await getDocs(collection(db,'users',fbUser.uid,'notes'));
    state.notes = notesSnap.docs.map(d=>({...d.data(),id:d.id}));
    const metaSnap = await getDoc(doc(db,'users',fbUser.uid,'meta','data'));
    if(metaSnap.exists()) { const m=metaSnap.data(); state.folders=m.folders||[]; state.lockPasswordHash=m.lockPasswordHash||null; }
  } catch(e){ console.warn('Firestore load error:',e); }
}
async function persistNote(n) {
  if(!db||!fbUser) { saveState(); return; }
  try { await window._fb.setDoc(window._fb.doc(db,'users',fbUser.uid,'notes',n.id),n); } catch(e){}
  saveState();
}
async function deleteNoteFirestore(id) {
  if(!db||!fbUser) { saveState(); return; }
  try { await window._fb.deleteDoc(window._fb.doc(db,'users',fbUser.uid,'notes',id)); } catch(e){}
  saveState();
}
async function persistMeta() {
  saveState();
  if(!db||!fbUser) return;
  try { await window._fb.setDoc(window._fb.doc(db,'users',fbUser.uid,'meta','data'),{folders:state.folders,lockPasswordHash:state.lockPasswordHash}); } catch(e){}
}

// ── AUTH ──
async function doGoogleLogin() {
  if(!hasFirebase()) { alert('Firebase가 설정되지 않았습니다.'); return; }
  if(!auth) { const ok=await initFirebase(); if(!ok){alert('Firebase 연결 실패');return;} }
  try { await window._fb.signInWithPopup(auth,new window._fb.GoogleAuthProvider()); }
  catch(e){ if(e.code!=='auth/popup-closed-by-user') showToast('로그인 실패: '+e.message); }
}
async function doSignOut() {
  if(auth&&fbUser) try { await window._fb.signOut(auth); } catch(e){}
  fbUser=null; state.localMode=false;
  document.getElementById('login-overlay').style.display='flex';
  document.getElementById('home-view').style.display='none';
  document.getElementById('editor-view').style.display='none';
  document.getElementById('user-bar').style.display='none';
}
function useLocal() {
  state.localMode=true;
  document.getElementById('login-overlay').style.display='none';
  launchApp(false);
}

// ── LAUNCH ──
function launchApp(isGoogle) {
  document.getElementById('login-overlay').style.display='none';
  const ub=document.getElementById('user-bar'); ub.style.display='flex';
  if(isGoogle&&fbUser) {
    document.getElementById('user-name-text').textContent=fbUser.displayName||fbUser.email||'';
    document.getElementById('user-mode-badge').textContent='클라우드';
  } else {
    document.getElementById('user-name-text').textContent='로컬 사용자';
    document.getElementById('user-mode-badge').textContent='로컬';
  }
  const pwSet=!!state.lockPasswordHash;
  document.getElementById('lock-banner').style.display=pwSet?'none':'flex';
  const pwBtn=document.getElementById('change-pw-btn');
  if(pwBtn) pwBtn.textContent=pwSet?'🔑 잠금PW 변경':'🔑 잠금PW 설정';
  if(!hasFirebase()) {
    const warn=document.createElement('div'); warn.className='firebase-warning';
    warn.innerHTML='⚠️ Firebase 미설정 — Google 로그인을 사용하려면 HTML 상단의 <b>FIREBASE_CONFIG</b>를 교체하세요.';
    document.getElementById('main').prepend(warn);
  }
  document.getElementById('sidebar-toggle').classList.add('open');
  renderSidebar(); renderHome();
}

// ── SIDEBAR ──
const isMobile=()=>window.innerWidth<=640;
function toggleSidebar() {
  if(isMobile()) {
    const sb=document.getElementById('sidebar'); const ov=document.getElementById('sidebar-overlay');
    const open=sb.classList.toggle('mobile-open'); ov.classList.toggle('visible',open);
    document.getElementById('sidebar-toggle').classList.toggle('open',open);
  } else {
    const sb=document.getElementById('sidebar');
    const collapsed=sb.classList.toggle('collapsed');
    document.getElementById('sidebar-toggle').classList.toggle('open',!collapsed);
  }
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebar-overlay').classList.remove('visible');
  document.getElementById('sidebar-toggle').classList.remove('open');
}
function renderSidebar() {
  const nav=document.getElementById('sidebar-nav');
  const counts={}; state.folders.forEach(f=>{counts[f.id]=state.notes.filter(n=>n.folderId===f.id).length;});
  const favCount=state.notes.filter(n=>n.starred).length;
  nav.innerHTML=`<div style="padding:4px 0">
    <div class="nav-label">메모</div>
    <div class="nav-item ${state.currentView==='all'?'active':''}" onclick="setView('all')">📝 전체 메모 <span class="count">${state.notes.length}</span></div>
    <div class="nav-item ${state.currentView==='favorites'?'active':''}" onclick="setView('favorites')">⭐ 즐겨찾기 <span class="count">${favCount}</span></div>
  </div>
  <div style="padding:4px 0">
    <div class="nav-label">폴더</div>
    ${state.folders.map(f=>`<div class="folder-item ${state.currentView==='folder:'+f.id?'active':''}" onclick="setView('folder:${f.id}')">📁 ${escHtml(f.name)} <span class="count">${counts[f.id]||0}</span><span class="folder-delete" onclick="deleteFolder('${f.id}',event)">✕</span></div>`).join('')}
    <div class="add-folder-btn" onclick="showAddFolderModal()">＋ 폴더 추가하기</div>
  </div>`;
}
function setView(v) {
  state.currentView=v;
  document.getElementById('home-view').style.display='';
  document.getElementById('editor-view').style.display='none';
  if(isMobile()) closeSidebar();
  renderSidebar(); renderHome();
}
function setSort(s) {
  state.sort=s;
  ['new','old','edit'].forEach(x=>document.getElementById('sort-'+x)?.classList.remove('active'));
  document.getElementById(s==='newest'?'sort-new':s==='oldest'?'sort-old':'sort-edit')?.classList.add('active');
  saveState(); renderHome();
}

// ── HOME ──
function getFilteredNotes() {
  let notes=[...state.notes];
  const q=(document.getElementById('search-input')?.value||'').trim().toLowerCase();
  if(q) notes=notes.filter(n=>n.title.toLowerCase().includes(q)||(n.textContent||'').toLowerCase().includes(q));
  if(state.currentView==='favorites') notes=notes.filter(n=>n.starred);
  else if(state.currentView.startsWith('folder:')) { const fid=state.currentView.split(':')[1]; notes=notes.filter(n=>n.folderId===fid); }
  if(state.sort==='newest') notes.sort((a,b)=>b.createdAt-a.createdAt);
  else if(state.sort==='oldest') notes.sort((a,b)=>a.createdAt-b.createdAt);
  else notes.sort((a,b)=>(b.editedAt||b.createdAt)-(a.editedAt||a.createdAt));
  return notes;
}
function renderHome() {
  const grid=document.getElementById('notes-grid');
  const notes=getFilteredNotes();
  const TITLES={all:'전체 메모',favorites:'⭐ 즐겨찾기'};
  let title=TITLES[state.currentView]||'';
  if(state.currentView.startsWith('folder:')) { const f=state.folders.find(x=>x.id===state.currentView.split(':')[1]); title=f?'📁 '+f.name:'폴더'; }
  document.getElementById('home-title').textContent=title;
  if(!notes.length) { grid.innerHTML='<div class="empty-state">메모가 없습니다.<br>새 메모를 작성해 보세요.</div>'; return; }
  grid.innerHTML=notes.map(n=>renderCard(n)).join('');
}
function renderCard(n) {
  const date=new Date(n.createdAt).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'});
  const star=n.starred?'⭐':'☆';
  const lockBadge=n.locked?'<div class="lock-badge"><span class="lock-icon">🔒</span><span class="lock-label">잠금</span></div>':'';
  const lockedClass=n.locked?' is-locked':'';
  if(n.coverId&&COVER_IMAGES[n.coverId]) {
    return `<div class="note-card${lockedClass}" onclick="openNote('${n.id}')">${lockBadge}
      <img class="note-card-cover" src="${COVER_IMAGES[n.coverId].src}" alt="표지">
      <div class="note-card-cover-overlay">
        <div class="note-card-cover-title">${escHtml(n.title||'제목 없음')}</div>
        <div class="note-card-cover-footer"><span class="note-card-cover-date">${date}</span><span class="note-card-cover-star" onclick="toggleStarCard('${n.id}',event)">${star}</span></div>
      </div></div>`;
  }
  return `<div class="note-card${lockedClass}" onclick="openNote('${n.id}')">${lockBadge}
    <div class="note-card-inner"><div class="note-card-title">${escHtml(n.title||'제목 없음')}</div><div class="note-card-preview">${escHtml((n.textContent||'').slice(0,80))}</div></div>
    <div class="note-card-footer"><span class="note-card-date">${date}</span><span class="note-card-star" onclick="toggleStarCard('${n.id}',event)">${star}</span></div></div>`;
}
function toggleStarCard(id,e) { e.stopPropagation(); const n=state.notes.find(x=>x.id===id); if(n){n.starred=!n.starred;persistNote(n);renderSidebar();renderHome();} }

// ── OPEN NOTE ──
function openNote(id) {
  const n=state.notes.find(x=>x.id===id); if(!n) return;
  if(n.locked) { showUnlockModal(n,()=>openNoteInEditor(n)); return; }
  openNoteInEditor(n);
}
function showUnlockModal(n, onSuccess) {
  showModal(`<h2>🔒 잠긴 메모</h2>
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">비밀번호를 입력하세요</p>
    <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')checkUnlockPw('${n.id}')">
    <div class="error-msg" id="pw-error"></div>
    <div class="modal-actions"><button class="modal-btn secondary" onclick="closeModal()">취소</button><button class="modal-btn primary" onclick="checkUnlockPw('${n.id}')">확인</button></div>`);
  setTimeout(()=>document.getElementById('pw-input')?.focus(),80);
  window._pwSuccess=onSuccess;
}
async function checkUnlockPw(id) {
  const pw=document.getElementById('pw-input').value;
  const hash=await sha256(pw);
  if(hash===state.lockPasswordHash){closeModal();window._pwSuccess&&window._pwSuccess();}
  else document.getElementById('pw-error').textContent='비밀번호가 틀렸습니다.';
}

// ── OPEN IN EDITOR ──
function openNoteInEditor(n) {
  state.currentNoteId=n.id;
  state.paperType=n.paperType||'plain';
  state.currentColor=null; state.currentHighlight=null;
  if(state.paperType==='manuscript'&&n.content&&!n.content.includes('<')) n.textContent=n.content;
  undoStack.length=0; redoStack.length=0;

  // ── pages 복원 ──
  const PAGE_SEP = '<!--PAGE_BREAK-->';
  if(n.pages && n.pages.length) {
    // 이전 방식 (pages 배열로 저장된 경우) 하위 호환
    pages = [...n.pages.map(p=>({...p}))];
  } else if(n.content && n.content.includes(PAGE_SEP)) {
    // 새 방식: PAGE_SEP으로 분할
    pages = n.content.split(PAGE_SEP).map((c,i)=>({id:'p'+i, content:c}));
  } else {
    pages = [{id:'p0', content: n.content||''}];
  }
  // 빈 pages 방어
  if(!pages.length) pages = [{id:'p0', content:''}];

  document.getElementById('home-view').style.display='none';
  document.getElementById('editor-view').style.display='flex';
  document.getElementById('editor-title').value=n.title||'';
  document.getElementById('font-size-input').value=n.fontSize||8;
  state.currentColor=null; state.currentHighlight=null;
  updateEditorInfo(n); updateLockBtn(n); updateStarBtn(n);
  if(isMobile()) closeSidebar();
  document.getElementById('manuscript-ta')?.remove();
  buildPagedEditor();
}

function updateEditorInfo(n) {
  const created=new Date(n.createdAt).toLocaleString('ko-KR');
  const edited=n.editedAt?new Date(n.editedAt).toLocaleString('ko-KR'):'-';
  const folder=n.folderId?(state.folders.find(f=>f.id===n.folderId)?.name||''):'없음';
  document.getElementById('editor-info').innerHTML=`<span>생성: ${created}</span><span>편집: ${edited}</span><span>폴더: ${folder}</span>`;
}
function updateLockBtn(n) { const b=document.getElementById('lock-btn'); if(b){b.innerHTML=n.locked?'🔒':'🔓';b.title=n.locked?'잠금 해제':'잠금 설정';} }
function updateStarBtn(n) { const b=document.getElementById('star-btn'); if(b) b.innerHTML=n.starred?'⭐':'☆'; }

// ── NEW NOTE ──
function newNote() {
  const id='note_'+Date.now();
  const n={id,title:'',content:'',textContent:'',pages:null,createdAt:Date.now(),editedAt:null,starred:false,locked:false,coverId:null,paperType:'plain',folderId:null,fontSize:16};
  if(state.currentView.startsWith('folder:')) n.folderId=state.currentView.split(':')[1];
  state.notes.push(n); persistNote(n); openNoteInEditor(n);
}

// ── PAGED EDITOR (글자 수 기반 페이지 분할) ──
//
// 설계 기준 (모든 형식 공통, 폰트 8pt 고정):
//   페이지 너비:  640px
//   상하 패딩:    56px × 2 = 112px
//   좌우 패딩:    52px × 2 = 104px
//   A4 높이:      640 × (297/210) ≈ 907px
//   내용 높이:    907 - 112 = 795px
//   내용 너비:    640 - 104 = 536px
//   8pt = 약 10.7px
//   줄 높이:      10.7 × 1.75 ≈ 19px → 사용 값 19px
//   한 줄 글자수: 약 67자 (보수적 적용 50자)
//   페이지 줄수:  floor(795 / 19) = 41줄
//   페이지당 글자: 50 × 41 = 2050자 ≈ 2000자
//
// 원고지:
//   20칸 × 행 수
//   셀 높이: 20px
//   행 수: floor(795 / 20) = 39행
//   페이지당: 20 × 39 = 780자

const PAGE_W      = 640;
const PAGE_PAD_V  = 56;
const PAGE_PAD_H  = 52;
const A4_RATIO    = 297 / 210;
const PAGE_H      = Math.round(PAGE_W * A4_RATIO);   // 907px
const CONTENT_H   = PAGE_H - PAGE_PAD_V * 2;          // 795px
const CONTENT_W   = PAGE_W - PAGE_PAD_H * 2;          // 536px
const FIXED_PT    = 8;
const FIXED_PX    = FIXED_PT * (4 / 3);               // ≈10.7px
const LINE_H_PX   = 19;                                // 줄 높이 (px)
const LINES_PER_PAGE = Math.floor(CONTENT_H / LINE_H_PX);  // 41줄
const CHARS_PER_LINE = 50;
const CHARS_PER_PAGE = LINES_PER_PAGE * CHARS_PER_LINE;   // ~2050자

// 원고지
const MS_COLS     = 20;
const MS_CELL     = 20;
const MS_ROWS     = Math.floor(CONTENT_H / MS_CELL);       // 39행
const MS_PER_PAGE = MS_COLS * MS_ROWS;

function disconnectObservers() {
  pageOverflowObservers.forEach(o=>o.disconnect());
  pageOverflowObservers = [];
}

// ── 에디터 contenteditable 구축 ──
function buildEditorContent(html, type, idx) {
  const ec = document.createElement('div');
  ec.className = 'editor-content' + (type === 'ruled' ? ' ruled' : '');
  ec.contentEditable = 'true';
  ec.spellcheck = false;
  ec.style.cssText = [
    'width:100%',
    `min-height:${CONTENT_H}px`,
    `max-height:${CONTENT_H}px`,
    'overflow:hidden',
    `padding:${PAGE_PAD_V}px ${PAGE_PAD_H}px`,
    `font-size:${FIXED_PT}pt`,
    `line-height:${LINE_H_PX}px`,
    'font-family:Georgia,serif',
    'color:var(--text)',
    'outline:none',
    'white-space:pre-wrap',
    'word-break:break-all',
    'box-sizing:border-box',
  ].join(';');
  if(type === 'ruled') {
    ec.style.backgroundImage = `repeating-linear-gradient(to bottom, transparent 0px, transparent ${LINE_H_PX-1}px, var(--line-color) ${LINE_H_PX-1}px, var(--line-color) ${LINE_H_PX}px)`;
    ec.style.backgroundPositionY = `${PAGE_PAD_V}px`;
    ec.style.backgroundAttachment = 'local';
  }
  ec.innerHTML = html || '';
  ec.dataset.pageIdx = String(idx);

  ec.addEventListener('keydown', e => onEditorKeyDown(e, idx));
  ec.addEventListener('keyup',   updateToolbarState);
  ec.addEventListener('mouseup', updateToolbarState);
  ec.addEventListener('paste',   handlePaste);
  ec.addEventListener('input',   () => {
    pages[idx].content = ec.innerHTML;
    updateCharCount();
  });
  return ec;
}

// ── 페이지 껍데기 (paper + wrap) ──
function createPageShell(idx, type) {
  const wrap = document.createElement('div');
  wrap.className = 'page-wrap';
  wrap.dataset.pageIdx = String(idx);

  const paper = document.createElement('div');
  paper.className = 'editor-paper ' + (type === 'manuscript' ? 'manuscript' : type === 'ruled' ? 'ruled' : 'plain');
  paper.style.cssText = `height:${PAGE_H}px;width:100%;max-width:${PAGE_W}px;position:relative;overflow:hidden;`;

  const pn = document.createElement('div');
  pn.className = 'page-num';

  // paper는 caller가 wrap에 직접 appendChild
  wrap.appendChild(paper);
  wrap.appendChild(pn);
  return { wrap, paper, pn };
}

function updatePageNums() {
  const wraps = document.querySelectorAll('#editor-area-wrapper .page-wrap');
  const total = wraps.length;
  wraps.forEach((w, i) => {
    const pn = w.querySelector('.page-num');
    if (pn) pn.textContent = (i + 1) + ' / ' + total;
  });
}

// ── keydown 핸들러: 글자 수 초과 시 자동 다음 페이지 ──
function onEditorKeyDown(e, idx) {
  // Ctrl+Z / Y 는 전역에서 처리
  if ((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key === 'z') { e.preventDefault(); doUndo(); return; }
  if ((e.ctrlKey||e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); doRedo(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key === 's') { e.preventDefault(); saveNote(); return; }

  // 글자 수 초과 감지: 입력 키이면서 현재 페이지가 한계에 도달했을 때
  const isPrintable = e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey;
  const isEnter     = e.key === 'Enter';
  if (!(isPrintable || isEnter)) return;

  const ec = e.currentTarget;
  const text = ec.innerText || '';
  const lineCount = text.split('\n').length;
  const charCount = text.replace(/\n/g, '').length;

  // 한 페이지 글자 수 또는 줄 수 초과 시 다음 페이지로
  const overChars = charCount >= CHARS_PER_PAGE;
  const overLines = lineCount > LINES_PER_PAGE;
  if (!(overChars || overLines)) return;

  e.preventDefault(); // 현재 페이지에 더 이상 입력 안 함

  // 현재 페이지 저장
  pages[idx].content = ec.innerHTML;

  // 다음 페이지가 없으면 새로 생성
  const nextIdx = idx + 1;
  if (!pages[nextIdx]) {
    pages.push({ id: 'p' + Date.now(), content: '' });
    appendPageToWrapper(nextIdx);
  }

  // 다음 페이지 에디터로 포커스 이동
  const nextEc = document.querySelector(`[data-page-idx="${nextIdx}"].editor-content`);
  if (nextEc) {
    nextEc.focus();
    placeCaretAtStart(nextEc);
    // Enter 키면 줄바꿈도 삽입
    if (isEnter) document.execCommand('insertParagraph');
    else if (isPrintable) document.execCommand('insertText', false, e.key);
    pages[nextIdx].content = nextEc.innerHTML;
    nextEc.closest('.page-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function placeCaretAtStart(el) {
  el.focus();
  const r = document.createRange();
  r.setStart(el, 0);
  r.collapse(true);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

// ── wrapper에 페이지 1장 추가 ──
function appendPageToWrapper(idx) {
  const wrapper = document.getElementById('editor-area-wrapper');
  const addBtn  = wrapper.querySelector('.add-page-btn');
  const type    = state.paperType;
  const { wrap, paper } = createPageShell(idx, type);
  const ec = buildEditorContent(pages[idx]?.content || '', type, idx);
  paper.appendChild(ec);
  wrapper.insertBefore(wrap, addBtn || null);
  updatePageNums();
}

// ── 전체 에디터 빌드 ──
function buildPagedEditor() {
  disconnectObservers();
  document.getElementById('manuscript-ta')?.remove();
  const wrapper = document.getElementById('editor-area-wrapper');
  wrapper.innerHTML = '';
  const type = state.paperType;

  if (type === 'manuscript') { buildManuscriptPages(wrapper); return; }

  pages.forEach((pg, idx) => {
    const { wrap, paper } = createPageShell(idx, type);
    const ec = buildEditorContent(pg.content || '', type, idx);
    paper.appendChild(ec);
    
    wrapper.appendChild(wrap);
  });

  updatePageNums();

  const addBtn = document.createElement('div');
  addBtn.className = 'add-page-btn';
  addBtn.innerHTML = '＋ 페이지 추가';
  addBtn.onclick   = addPage;
  wrapper.appendChild(addBtn);

  // 마지막 페이지 포커스
  setTimeout(() => {
    const ecs = wrapper.querySelectorAll('.editor-content');
    if (ecs.length) ecs[ecs.length - 1].focus();
  }, 60);
}

function addPage() {
  // 현재 모든 페이지 동기화
  document.querySelectorAll('#editor-area-wrapper .editor-content').forEach(ec => {
    const i = parseInt(ec.dataset.pageIdx);
    if (!isNaN(i) && pages[i]) pages[i].content = ec.innerHTML;
  });
  pages.push({ id: 'p' + Date.now(), content: '' });
  buildPagedEditor();
  showToast(pages.length + '페이지가 추가되었습니다.');
  setTimeout(() => {
    const ecs = document.querySelectorAll('#editor-area-wrapper .editor-content');
    const last = ecs[ecs.length - 1];
    if (last) { last.focus(); last.closest('.page-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }, 80);
}

// ── 원고지 ──
// 입력 방향: 가로(행) 우선 — 왼쪽에서 오른쪽, 위에서 아래
// 셀 크기: CONTENT_W를 20칸으로 정확히 나눔 (넘침 없음)
function buildManuscriptPages(wrapper) {
  const n = state.notes.find(x => x.id === state.currentNoteId);
  const text = n ? (n.textContent || '').replace(/\u200B/g, '') : '';
  const totalPages = Math.max(1, Math.ceil((text.length + 1) / MS_PER_PAGE));

  // 셀 너비: CONTENT_W / MS_COLS (소수점 버림)
  // 나머지 픽셀은 grid 여백으로 흡수
  const cellW = Math.floor(CONTENT_W / MS_COLS); // 26px
  const cellH = MS_CELL;                          // 20px

  for (let pg = 0; pg < totalPages; pg++) {
    const { wrap, paper } = createPageShell(pg, 'manuscript');

    // 격자 컨테이너: paper 안에서 패딩 적용
    const gridWrap = document.createElement('div');
    gridWrap.style.cssText = `
      position:absolute;
      top:${PAGE_PAD_V}px;
      left:${PAGE_PAD_H}px;
      width:${cellW * MS_COLS}px;
      height:${cellH * MS_ROWS}px;
      display:grid;
      grid-template-columns:repeat(${MS_COLS},${cellW}px);
      grid-template-rows:repeat(${MS_ROWS},${cellH}px);
      border-top:1.5px solid #c0a88a;
      border-left:1.5px solid #c0a88a;
      box-sizing:content-box;
    `;

    const pageText = text.slice(pg * MS_PER_PAGE, (pg + 1) * MS_PER_PAGE);

    // 행 우선(가로) 순서: i번째 셀 = (row=floor(i/MS_COLS), col=i%MS_COLS)
    for (let i = 0; i < MS_ROWS * MS_COLS; i++) {
      const cell = document.createElement('div');
      cell.style.cssText = `
        width:${cellW}px;
        height:${cellH}px;
        border-right:1.5px solid #c0a88a;
        border-bottom:1.5px solid #c0a88a;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:${FIXED_PT}pt;
        font-family:Georgia,serif;
        color:var(--text);
        box-sizing:border-box;
        overflow:hidden;
      `;
      cell.textContent = pageText[i] || '';
      gridWrap.appendChild(cell);
    }

    paper.style.position = 'relative';
    paper.appendChild(gridWrap);
    
    wrapper.appendChild(wrap);
  }

  updatePageNums();

  // 투명 textarea
  const ta = document.createElement('textarea');
  ta.id = 'manuscript-ta';
  ta.style.cssText = 'position:fixed;opacity:0;width:1px;height:1px;top:0;left:0;z-index:-1;pointer-events:none;';
  ta.maxLength = MAX_CHARS;
  ta.value = text;

  // 한글 IME 조합 중 여부 추적
  let isComposing = false;
  let rebuildTimer = null;

  function rebuildManuscript() {
    // 디바운스: 연속 호출 시 마지막 1회만 실행
    clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(() => {
      const nn = state.notes.find(x => x.id === state.currentNoteId);
      if (!nn) return;
      const ta2 = document.getElementById('manuscript-ta');
      const currentVal = ta2 ? ta2.value : ta.value;
      nn.textContent = currentVal.replace(/\u200B/g, '');
      updateCharCount();
      const w2 = document.getElementById('editor-area-wrapper');
      document.getElementById('manuscript-ta')?.remove();
      w2.innerHTML = '';
      buildManuscriptPages(w2);
      setTimeout(() => document.getElementById('manuscript-ta')?.focus(), 0);
    }, 50); // 50ms 디바운스 (compositionend + input 중복 방지)
  }

  ta.addEventListener('compositionstart', () => { isComposing = true; });
  ta.addEventListener('compositionend',   () => { isComposing = false; rebuildManuscript(); });
  ta.addEventListener('input', () => {
    // IME 조합 중에는 격자 갱신 안 함 (자모 분리 방지)
    if (isComposing) return;
    rebuildManuscript();
  });
  document.body.appendChild(ta);

  // 페이지 추가 버튼
  const addBtn = document.createElement('div');
  addBtn.className = 'add-page-btn';
  addBtn.innerHTML = '＋ 페이지 추가';
  addBtn.onclick = () => {
    const ta2 = document.getElementById('manuscript-ta');
    if (!ta2) return;
    const curText = ta2.value.replace(/\u200B/g, '');
    const curPages = Math.max(1, Math.ceil((curText.length + 1) / MS_PER_PAGE));
    const needed = curPages * MS_PER_PAGE - curText.length;
    ta2.value = curText + ' '.repeat(needed);
    ta2.dispatchEvent(new Event('input'));
    showToast('원고지 페이지가 추가되었습니다.');
  };
  wrapper.appendChild(addBtn);

  // 클릭 시 포커스
  wrapper.querySelectorAll('.editor-paper.manuscript')
    .forEach(el => el.addEventListener('click', () =>
      document.getElementById('manuscript-ta')?.focus()));
}

// ── 글자 수 카운터 ──
function updateCharCount() {
  let len = 0;
  if (state.paperType === 'manuscript') {
    const ta = document.getElementById('manuscript-ta');
    len = ta ? ta.value.length : (state.notes.find(x=>x.id===state.currentNoteId)?.textContent||'').length;
  } else {
    document.querySelectorAll('#editor-area-wrapper .editor-content').forEach(ec => {
      len += (ec.innerText || '').length;
    });
  }
  const el = document.getElementById('char-count');
  if (el) el.textContent = len.toLocaleString() + ' / ' + MAX_CHARS.toLocaleString();
}

function checkPageOverflow() {} // no-op (keydown 방식으로 대체)

// ── SAVE ──
async function saveNote() {
  const n=state.notes.find(x=>x.id===state.currentNoteId); if(!n) return;

  if(state.paperType==='manuscript'){
    const ta=document.getElementById('manuscript-ta');
    const text=(ta?ta.value:(n.textContent||'')).replace(/\u200B/g,'');
    n.content=text; n.textContent=text; n.pages=null;
    if(ta) ta.value=text;
  } else {
    // 모든 페이지 DOM → pages 배열 동기화
    document.querySelectorAll('#editor-area-wrapper .editor-content').forEach(ec=>{
      const idx=parseInt(ec.dataset.pageIdx);
      if(!isNaN(idx)&&pages[idx]) pages[idx].content=ec.innerHTML;
    });
    // ★ 전체 페이지 내용을 페이지 구분자로 이어붙여 하나의 문자열로 저장
    // 페이지 구분자: <!--PAGE_BREAK--> (HTML 주석이므로 렌더링에 영향 없음)
    const PAGE_SEP = '<!--PAGE_BREAK-->';
    n.content = pages.map(p=>p.content||'').join(PAGE_SEP);
    n.pages = null; // pages 배열 대신 content 하나로 통합 저장
    const tmp=document.createElement('div');
    tmp.innerHTML=pages.map(p=>p.content||'').join('');
    n.textContent=tmp.innerText||'';
  }

  n.title=document.getElementById('editor-title').value.trim();
  if(!n.title){
    n.title='텍스트 메모_'+String(state.notes.indexOf(n)+1).padStart(2,'0');
    document.getElementById('editor-title').value=n.title;
  }
  n.paperType=state.paperType; n.editedAt=Date.now();
  n.fontSize=parseInt(document.getElementById('font-size-input').value)||8;
  await persistNote(n); updateEditorInfo(n); showToast('저장되었습니다.');
}
function backToHome() {
  saveNote();
  disconnectObservers();
  document.getElementById('manuscript-ta')?.remove();
  state.currentNoteId=null;
  document.getElementById('home-view').style.display='';
  document.getElementById('editor-view').style.display='none';
  renderSidebar(); renderHome();
}

// ── FORMAT (참조 파일 방식) ──
// 핵심: 툴바 버튼 mousedown에서 preventDefault → editor focus/selection 유지
// color input은 mousedown이 아닌 change 이벤트이므로 별도 처리 불필요
document.querySelector('.editor-toolbar').addEventListener('mousedown', function(e) {
  // input[type=color], input[type=number]는 제외 (직접 상호작용 필요)
  if(e.target.tagName !== 'INPUT') e.preventDefault();
});

function fmt(cmd) {
  // mousedown preventDefault 덕분에 selection 유지됨 → 바로 execCommand
  document.execCommand(cmd);
  updateToolbarState();
}
function updateToolbarState() {
  document.getElementById('btn-bold')?.classList.toggle('active', document.queryCommandState('bold'));
  document.getElementById('btn-italic')?.classList.toggle('active', document.queryCommandState('italic'));
}

// selectionchange로 툴바 상태 실시간 업데이트 (참조 파일 방식)
document.addEventListener('selectionchange', () => {
  if(document.getElementById('editor-view').style.display !== 'none') updateToolbarState();
});

// 글자색: color input change → focus 없이 바로 execCommand
// (input[type=color]는 클릭 시 브라우저 색상 피커를 열고, change 시 selection이 살아있음)
function applyColor() {
  const c = document.getElementById('fontColor').value;
  document.execCommand('foreColor', false, c);
}
function applyHL() {
  const c = document.getElementById('hlColor').value;
  if(!document.execCommand('hiliteColor', false, c)) document.execCommand('backColor', false, c);
}
function clearHL() {
  document.execCommand('hiliteColor', false, 'transparent');
}
function applyFontSize(size) {
  size = Math.max(1, Math.min(30, parseInt(size)||16));
  document.getElementById('font-size-input').value = size;
  const ec = getActiveEditor(); if(!ec) return;
  const sel = window.getSelection();
  if(sel && sel.rangeCount && !sel.isCollapsed) {
    pushUndo();
    const r = sel.getRangeAt(0);
    try {
      const sp = document.createElement('span');
      sp.style.fontSize = size + 'pt';
      r.surroundContents(sp);
    } catch(e) {
      document.execCommand('fontSize', false, '7');
      ec.querySelectorAll('font[size="7"]').forEach(el => { el.removeAttribute('size'); el.style.fontSize = size+'pt'; });
    }
  }
}
function fmtBold(){ fmt('bold'); }
function fmtItalic(){ fmt('italic'); }

function getActiveEditor() {
  // 현재 포커스된 contenteditable 반환
  const ae = document.activeElement;
  if(ae && (ae.contentEditable==='true') && ae.closest('#editor-area-wrapper')) return ae;
  return document.querySelector('#editor-area-wrapper [contenteditable="true"]');
}

let typingStyleSpan = null;
function syncTypingStyleSpan(){}
function handleTypingStyleInput(){}

// ── UNDO / REDO ──
function pushUndo(){const ec=getActiveEditor();if(!ec)return;undoStack.push(ec.innerHTML);if(undoStack.length>UNDO_LIMIT)undoStack.shift();redoStack.length=0;}
function doUndo(){const ec=getActiveEditor();if(!ec)return;if(!undoStack.length){ec.focus();document.execCommand('undo');updateCharCount();return;}redoStack.push(ec.innerHTML);ec.innerHTML=undoStack.pop();const idx=parseInt(ec.dataset.pageIdx);if(!isNaN(idx)&&pages[idx])pages[idx].content=ec.innerHTML;placeCaretAtEnd(ec);updateCharCount();}
function doRedo(){const ec=getActiveEditor();if(!ec)return;if(!redoStack.length){ec.focus();document.execCommand('redo');updateCharCount();return;}undoStack.push(ec.innerHTML);ec.innerHTML=redoStack.pop();const idx=parseInt(ec.dataset.pageIdx);if(!isNaN(idx)&&pages[idx])pages[idx].content=ec.innerHTML;placeCaretAtEnd(ec);updateCharCount();}

function saveSelection(){const sel=window.getSelection();const r=[];for(let i=0;i<sel.rangeCount;i++)r.push(sel.getRangeAt(i).cloneRange());return r;}
function restoreSelection(ranges){const sel=window.getSelection();sel.removeAllRanges();ranges.forEach(r=>sel.addRange(r));}
function placeCaretAtEnd(el){el.focus();const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}


// ── PASTE ──
function handlePaste(e) {
  e.preventDefault();
  for(const item of e.clipboardData.items){
    if(item.type.startsWith('image/')){
      const reader=new FileReader();
      reader.onload=ev=>{pushUndo();document.execCommand('insertHTML',false,`<img src="${ev.target.result}" class="editor-image">`);}
      reader.readAsDataURL(item.getAsFile()); return;
    }
  }
  const text=e.clipboardData.getData('text/plain'); if(!text) return;
  const ec=getActiveEditor(); if(!ec) return;
  const curLen=(ec.innerText||'').length; const allowed=MAX_CHARS-curLen;
  if(allowed<=0){showToast('글자 수 제한에 도달했습니다.');return;}
  const clipped=text.slice(0,allowed);
  if(clipped.length<text.length) showToast(`글자 수 제한으로 일부만 붙여넣었습니다. (${clipped.length.toLocaleString()}자)`);
  pushUndo();
  const sel=window.getSelection(); if(!sel||sel.rangeCount===0){ec.focus();}
  const range=sel.getRangeAt(0); range.deleteContents();
  const lines=clipped.split('\n'); const frag=document.createDocumentFragment();
  lines.forEach((line,i)=>{frag.appendChild(document.createTextNode(line));if(i<lines.length-1)frag.appendChild(document.createElement('br'));});
  const lastNode=frag.lastChild; range.insertNode(frag);
  if(lastNode){const nr=document.createRange();nr.setStartAfter(lastNode);nr.collapse(true);sel.removeAllRanges();sel.addRange(nr);}
  updateCharCount();
}

// ── IMAGE ──
function insertImage() {
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{pushUndo();document.execCommand('insertHTML',false,`<img src="${ev.target.result}" class="editor-image">`);};reader.readAsDataURL(file);};
  inp.click();
}

// ── LOCK ──
async function sha256(msg){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function persistLockPw(hash){state.lockPasswordHash=hash;await persistMeta();}
function showSetLockPasswordModal(){
  showModal(`<h2>🔒 잠금 비밀번호 최초 설정</h2>
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">한 번만 설정하면 이후 모든 메모 잠금에 공통으로 사용됩니다.</p>
    <input type="password" id="pw1" placeholder="비밀번호 (4자 이상 권장)">
    <input type="password" id="pw2" placeholder="비밀번호 확인" onkeydown="if(event.key==='Enter')confirmSetLockPw()">
    <div class="error-msg" id="pw-err"></div>
    <div class="modal-actions"><button class="modal-btn secondary" onclick="closeModal()">취소</button><button class="modal-btn primary" onclick="confirmSetLockPw()">설정</button></div>`);
  setTimeout(()=>document.getElementById('pw1')?.focus(),80);
}
async function confirmSetLockPw(){
  const p1=document.getElementById('pw1').value,p2=document.getElementById('pw2').value;
  if(!p1){document.getElementById('pw-err').textContent='비밀번호를 입력하세요.';return;}
  if(p1!==p2){document.getElementById('pw-err').textContent='비밀번호가 일치하지 않습니다.';return;}
  const hash=await sha256(p1); await persistLockPw(hash);
  document.getElementById('lock-banner').style.display='none';
  const pwBtn=document.getElementById('change-pw-btn'); if(pwBtn)pwBtn.textContent='🔑 잠금PW 변경';
  closeModal(); showToast('잠금 비밀번호가 설정되었습니다.');
}
function showChangeLockPasswordModal(){
  if(!state.lockPasswordHash){showSetLockPasswordModal();return;}
  showModal(`<h2>🔑 잠금 비밀번호 변경</h2>
    <input type="password" id="pw0" placeholder="현재 비밀번호">
    <input type="password" id="pw1" placeholder="새 비밀번호">
    <input type="password" id="pw2" placeholder="새 비밀번호 확인" onkeydown="if(event.key==='Enter')confirmChangeLockPw()">
    <div class="error-msg" id="pw-err"></div>
    <div class="modal-actions"><button class="modal-btn secondary" onclick="closeModal()">취소</button><button class="modal-btn primary" onclick="confirmChangeLockPw()">변경</button></div>`);
  setTimeout(()=>document.getElementById('pw0')?.focus(),80);
}
async function confirmChangeLockPw(){
  const p0=document.getElementById('pw0').value,p1=document.getElementById('pw1').value,p2=document.getElementById('pw2').value;
  const h0=await sha256(p0);
  if(h0!==state.lockPasswordHash){document.getElementById('pw-err').textContent='현재 비밀번호가 틀렸습니다.';return;}
  if(!p1){document.getElementById('pw-err').textContent='새 비밀번호를 입력하세요.';return;}
  if(p1!==p2){document.getElementById('pw-err').textContent='비밀번호가 일치하지 않습니다.';return;}
  const hash=await sha256(p1); await persistLockPw(hash); closeModal(); showToast('비밀번호가 변경되었습니다.');
}
function showLockModal(){
  const n=state.notes.find(x=>x.id===state.currentNoteId); if(!n) return;
  if(!state.lockPasswordHash){showToast('먼저 잠금 비밀번호를 설정해 주세요.');showSetLockPasswordModal();return;}
  n.locked=!n.locked; persistNote(n); updateLockBtn(n); renderHome();
  showToast(n.locked?'메모가 잠겼습니다.':'잠금이 해제되었습니다.');
}

// ── COVER ──
function showCoverModal(){
  const n=state.notes.find(x=>x.id===state.currentNoteId);
  const keys=Object.keys(COVER_IMAGES);
  const html=`<div class="cover-option none-cover ${!n.coverId?'selected':''}" onclick="selectCover(null,this)">표지 없음</div>`+
    keys.map(k=>`<div class="cover-option ${n.coverId===k?'selected':''}" onclick="selectCover('${k}',this)"><img src="${COVER_IMAGES[k].src}" alt="${COVER_IMAGES[k].name}"><div style="font-size:10px;text-align:center;padding:2px;">${COVER_IMAGES[k].name}</div></div>`).join('');
  showModal(`<h2>📎 표지 선택</h2><div class="cover-grid">${html}</div><div class="modal-actions"><button class="modal-btn secondary" onclick="closeModal()">닫기</button></div>`);
}
function selectCover(coverId,el){document.querySelectorAll('.cover-option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const n=state.notes.find(x=>x.id===state.currentNoteId);if(n){n.coverId=coverId;persistNote(n);}setTimeout(closeModal,300);}

// ── PAPER TYPE ──
function showPaperModal(){
  const opts=PAPER_TYPES.map(p=>`<div class="paper-opt ${state.paperType===p.id?'selected':''}" onclick="selectPaper('${p.id}',this)">${p.icon}<br>${p.label}</div>`).join('');
  showModal(`<h2>📄 메모지 형식</h2><div class="paper-opt-grid">${opts}</div><div class="modal-actions"><button class="modal-btn secondary" onclick="closeModal()">닫기</button></div>`);
}
function selectPaper(type, el){
  document.querySelectorAll('.paper-opt').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');

  const n = state.notes.find(x=>x.id===state.currentNoteId);
  if(!n) { setTimeout(closeModal,300); return; }

  // ── 전환 전 현재 내용 정리 ──
  if(state.paperType === 'manuscript') {
    // 원고지 → 다른 형식: textarea 내용을 pages[0]에 저장
    const ta = document.getElementById('manuscript-ta');
    const txt = ta ? ta.value.replace(/\u200B/g,'') : (n.textContent||'');
    n.textContent = txt;
    pages = [{ id:'p0', content: txt }];
  } else {
    // 무지/줄노트 → 다른 형식: editor-content 내용을 pages에 동기화
    document.querySelectorAll('#editor-area-wrapper .editor-content').forEach(ec => {
      const idx = parseInt(ec.dataset.pageIdx);
      if(!isNaN(idx) && pages[idx]) pages[idx].content = ec.innerHTML;
    });
    if(type === 'manuscript') {
      // 무지/줄노트 → 원고지: 모든 페이지 텍스트를 합쳐 textContent로 변환
      const allText = pages.map(pg => {
        const tmp = document.createElement('div');
        tmp.innerHTML = pg.content || '';
        return tmp.innerText || '';
      }).join('');
      n.textContent = allText;
    }
  }

  state.paperType = type;
  n.paperType = type;
  disconnectObservers();
  document.getElementById('manuscript-ta')?.remove();
  buildPagedEditor();
  setTimeout(closeModal, 300);
}

// ── MOVE / STAR / EXPORT / DELETE ──
function showMoveModal(){
  const n=state.notes.find(x=>x.id===state.currentNoteId); if(!n) return;
  const opts=`<div class="paper-opt ${!n.folderId?'selected':''}" onclick="moveToFolder(null,this)">폴더 없음</div>`+state.folders.map(f=>`<div class="paper-opt ${n.folderId===f.id?'selected':''}" onclick="moveToFolder('${f.id}',this)">📁 ${escHtml(f.name)}</div>`).join('');
  showModal(`<h2>📁 폴더 이동</h2><div class="paper-opt-grid">${opts}</div><div class="modal-actions"><button class="modal-btn secondary" onclick="closeModal()">닫기</button></div>`);
}
function moveToFolder(fid,el){document.querySelectorAll('.paper-opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const n=state.notes.find(x=>x.id===state.currentNoteId);if(n){n.folderId=fid;persistNote(n);updateEditorInfo(n);}setTimeout(closeModal,300);}
function toggleStarEditor(){const n=state.notes.find(x=>x.id===state.currentNoteId);if(!n)return;n.starred=!n.starred;persistNote(n);updateStarBtn(n);showToast(n.starred?'즐겨찾기에 추가되었습니다.':'즐겨찾기에서 제거되었습니다.');}
function exportNote(){const n=state.notes.find(x=>x.id===state.currentNoteId);if(!n)return;const text=getActiveEditor()?.innerText||n.textContent||'';const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(n.title||'메모')+'.txt';a.click();URL.revokeObjectURL(a.href);showToast('텍스트 파일로 저장되었습니다.');}
async function deleteCurrentNote(){if(!confirm('이 메모를 삭제하시겠습니까?'))return;state.notes=state.notes.filter(x=>x.id!==state.currentNoteId);await deleteNoteFirestore(state.currentNoteId);backToHome();}

// ── FOLDER ──
function showAddFolderModal(){
  showModal(`<h2>📁 폴더 추가</h2>
    <input type="text" id="folder-name-input" placeholder="폴더 이름" maxlength="30" onkeydown="if(event.key==='Enter')addFolder()">
    <div class="modal-actions"><button class="modal-btn secondary" onclick="closeModal()">취소</button><button class="modal-btn primary" onclick="addFolder()">추가</button></div>`);
  setTimeout(()=>document.getElementById('folder-name-input')?.focus(),80);
}
async function addFolder(){const name=document.getElementById('folder-name-input').value.trim();if(!name)return;state.folders.push({id:'folder_'+Date.now(),name});await persistMeta();closeModal();renderSidebar();}
async function deleteFolder(id,e){e.stopPropagation();if(!confirm('폴더를 삭제하면 메모의 폴더 지정이 해제됩니다.'))return;state.folders=state.folders.filter(f=>f.id!==id);state.notes.forEach(n=>{if(n.folderId===id)n.folderId=null;});if(state.currentView==='folder:'+id)state.currentView='all';await persistMeta();renderSidebar();renderHome();}

function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('toast-container').appendChild(t);setTimeout(()=>t.remove(),2200);}

// ── UTILS ──
function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if(state.currentNoteId)saveNote();}});

loadState();
(async()=>{
  let fbOk = false;
  if(hasFirebase()) {
    // 5초 타임아웃: Firebase SDK 로드가 지연될 경우 로그인 화면을 먼저 표시
    const timeout = new Promise(resolve => setTimeout(() => resolve(false), 5000));
    fbOk = await Promise.race([initFirebase(), timeout]);
  }
  if(!fbOk){
    // Firebase 없거나 실패 → 로그인 화면
    document.getElementById('login-overlay').style.display='flex';
  }
  // Firebase 성공 시 onAuthStateChanged가 launchApp 호출
})();
</script>
